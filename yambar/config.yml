hack: &hack JetBrains Mono:pixelsize=13
bg_default: &bg_default {stack: [{background: {color: 81A1C1ff}}, {underline: {size: 4, color: D8DEE9ff}}]}
bar:
  monitor: eDP-1
  height: 32
  location: top
  font: JuliaMono:pixelsize=13
  spacing: 2
  margin: 0
  layer: bottom
  foreground: eeeeeeff
  background: 2E3440dd

  left:
    - river:
        anchors:
          - base: &river_base
              left-margin: 10
              right-margin: 13 
              # default: {string: {text: , font: *hack}}
              conditions:
                id == 1: {string: {text: 1, font: *hack}}  
                id == 2: {string: {text: 2, font: *hack}}  
                id == 3: {string: {text: 3, font: *hack}}  
                id == 4: {string: {text: 4, font: *hack}}  
                id == 5: {string: {text: 5, font: *hack}}  
                id == 6: {string: {text: 6, font: *hack}}  
                id == 7: {string: {text: 7, font: *hack}}  
                id == 8: {string: {text: 8, font: *hack}}  
                id == 9: {string: {text: 9, font: *hack}}  
                # id == 10: {string: {text: "scratchpad", font: *hack}}  
                # id == 11: {string: {text: "work", font: *hack}}  

        content:
          map:
            on-click: 
              left: sh -c "riverctl set-focused-tags $((1 << ({id} - 1)))"
              right: sh -c "riverctl toggle-focused-tags $((1 << ({id} -1)))"
              middle: sh -c "riverctl toggle-view-tags $((1 << ({id} -1)))"
            conditions:
              state == urgent:
                map:
                  <<: *river_base
                  deco: {background: {color: D08770ff}}
              state == focused:
                map:
                  <<: *river_base
                  deco: *bg_default
              state == visible && ~occupied:
                map:
                  <<: *river_base
              state == visible && occupied:
                map:
                  <<: *river_base
                  deco: *bg_default
              state == unfocused:
                map:
                  <<: *river_base
                  deco: {underline: {size: 3, color: 6C5AAAff}}
              state == invisible && ~occupied:
                map:
                  <<: *river_base
              state == invisible && occupied:
                map:
                  <<: *river_base
                  deco: {underline: {size: 3, color: D8DEE9ff}}

  right:
    
    - battery:
        name: BAT0
        poll-interval: 30000
        anchors:
          discharging: &discharging
            list:
              items:
                - ramp:
                    tag: capacity
                    items:
                      - string: {text: , font: *hack}
                      - string: {text: , font: *hack}
                      - string: {text: , font: *hack}
                      - string: {text: , font: *hack}
                      - string: {text: , font: *hack}
                      - string: {text: , font: *hack}
                      - string: {text: , font: *hack}
                      - string: {text: , font: *hack}
                      - string: {text: , font: *hack}
                      - string: {text: , font: *hack}
                - string: {text: "{capacity}%", left-margin: 5}
        content:
          map:
            conditions:
              state == unknown:
                <<: *discharging
              state == discharging:
                <<: *discharging
              state == charging:
                - string: {text: , font: *hack, right-margin: 3}
                - string: {text: "{capacity}%"}
              state == full:
                - string: {text: , font: *hack}
                - string: {text: "{capacity}%", left-margin: 5}
              state == "not charging":
                - ramp:
                    tag: capacity
                    items:
                      - string: {text: , font: *hack}
                - string: {text: "{capacity}%", left-margin: 5}



    - label:
        content:
          string: {text: "│"}

    - clock:
        date-format: "%d.%m.%y"
        content:
          - string: {text: , font: *hack}
          - string: {text: " {date}"}

    - label:
        content:
          string: {text: "│"}

    - clock:
        time-format: "%I:%M %p"
        content:
          - string: {text: , font: *hack}
          - string: {text: " {time}"}
